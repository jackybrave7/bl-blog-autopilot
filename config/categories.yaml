# Категории WordPress для умного присвоения (translate → category_keys → id)
# https://www.bl-school.com/blog/wp-json/wp/v2/categories

categories:
  artists:
    id: 9
    name: Художники и иллюстраторы
    hint: современные художники, интервью, портреты мастеров, арт-практика

  illustration:
    id: 26
    name: Иллюстрация
    hint: иллюстрация, коммерческий арт, editorial, визуальный сторителлинг

  book-illustration:
    id: 97
    name: Книжная иллюстрация
    hint: книжная графика, обложки, детские книги, издательская иллюстрация

  sketching:
    id: 20
    name: Скетчинг и графика
    hint: скетчи, графика, рисунок, наброски, карандаш, тушь

  technics:
    id: 136
    name: Техники
    hint: техники и материалы, мастер-классы, процесс создания, инструменты

  art-history:
    id: 119
    name: История искусства
    hint: история искусства, музеи, антиквариат, классика, архивы, реставрация

  diaries:
    id: 4
    name: Дневники
    hint: личные заметки художника, дневник практики, размышления о творчестве

  watercolor:
    id: 103
    name: Акварель
    hint: акварельная живопись и техника

  design:
    id: 112
    name: Дизайн
    hint: графический дизайн, постеры, брендинг, визуальная коммуникация

defaults:
  max_categories: 2
  fallback_keys: [art-history, artists]
