# Категории WordPress для умного присвоения (translate → category_keys → id)
# https://www.bl-school.com/blog/wp-json/wp/v2/categories

categories:
  illustration:
    id: 26
    name: Иллюстрация
    hint: иллюстрация, коммерческий арт, editorial, процесс рисования, инструменты иллюстратора

  book-illustration:
    id: 97
    name: Книжная иллюстрация
    hint: книжная графика, обложки, детские книги, издательская иллюстрация

  sketching:
    id: 20
    name: Скетчинг и графика
    hint: скетчи, графика, рисунок, наброски, карандаш, тушь, скетчбук

  technics:
    id: 136
    name: Техники
    hint: техники и материалы, мастер-классы, пошаговые гайды, кисти, бумага, Procreate/Photoshop для художника

  watercolor:
    id: 103
    name: Акварель
    hint: акварельная живопись, техника, материалы, мокрым по мокрому

  artists:
    id: 9
    name: Художники и иллюстраторы
    hint: практика художника, студия, метод работы, разбор приёмов (не соцтренды и не маркетинг)

  art-history:
    id: 119
    name: История искусства
    hint: история искусства, музеи, классика, техники старых мастеров, реставрация

  diaries:
    id: 4
    name: Дневники
    hint: личные заметки художника, дневник практики, лайфхаки из студии

  design:
    id: 112
    name: Дизайн
    hint: только если статья про визуальные приёмы для художника; не реклама и не брендинг

defaults:
  max_categories: 2
  fallback_keys: [illustration, technics]
